# Vérifie chaque envoi sur main et chaque demande de fusion : types, construction, tests du compilateur
# (attaques sur de vrais serveurs produits comprises), puis l'extension VS Code.
name: Vérification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilateur:
    name: Compilateur
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Construire
        run: npm run build
      # Les tests de vrais serveurs produits installent leurs paquets (packs Astratra, publics sur npm)
      # dans des dossiers temporaires : il leur faut le réseau, que GitHub fournit.
      - name: Tests
        run: npm test

  extension:
    name: Extension VS Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: editeur/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editeur/vscode/package-lock.json
      # Le serveur de langage importe le compilateur (../../src) : ses paquets aussi.
      - name: Installer le compilateur
        working-directory: .
        run: npm ci
      - name: Installer l'extension
        run: npm ci
      - name: Tests
        run: npm test
